[project]
name = "jobs-scrape-mcp"
version = "0.1.0"
description = "Serveur MCP exposant le corpus jobs-scrape a une IA"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xavier Beheydt", email = "xavier.beheydt@gmail.com" }]

dependencies = ["jobs-scrape>=0.1.0", "mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
jobs-scrape-mcp = "jobs_scrape_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_scrape_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
